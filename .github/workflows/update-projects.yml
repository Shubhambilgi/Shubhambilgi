name: Update GitHub Profile

on:
  schedule:
    # Every day at approximately 12:00 AM IST
    - cron: "30 18 * * *"

  # Allows you to run the workflow manually.
  workflow_dispatch:

  # Run automatically when the script or workflow itself changes.
  push:
    branches:
      - main
    paths:
      - "scripts/update_projects.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:

  update-readme:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Install Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Install Python dependency
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          pip install requests

      # ------------------------------------------------------
      # Run Python script
      # ------------------------------------------------------

      - name: Update GitHub profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_projects.py

      # ------------------------------------------------------
      # Commit README changes
      # ------------------------------------------------------

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "chore: update GitHub profile"

            git push

          fi
